<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario de Software - Salón de Cómputo</title>
    <!-- Tailwind CSS para diseño moderno -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen p-6">

    <div class="max-w-4xl mx-auto bg-white shadow-lg rounded-xl p-6 md:p-8">
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-gray-800">Inventario de Software del Salón</h1>
            <p class="text-gray-500 mt-2">Consulta los programas instalados en cada equipo o busca software de forma individual.</p>
        </header>

        <!-- Buscador de Software -->
        <div class="mb-8 bg-blue-50 p-4 rounded-lg border border-blue-100">
            <label for="searchSoftware" class="block text-sm font-medium text-blue-900 mb-2">Buscar Software Individual:</label>
            <input type="text" id="searchSoftware" placeholder="Ej. Python, AutoCAD, Office..." 
                class="w-full px-4 py-2 border border-blue-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white">
            <div id="searchResults" class="mt-4 text-sm text-gray-700"></div>
        </div>

        <!-- Listado de las Computadoras -->
        <h2 class="text-xl font-semibold text-gray-800 mb-4">Listado de las 31 Computadoras</h2>
        <div id="pcList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <p class="text-gray-500 col-span-full text-center py-4">Cargando base de datos...</p>
        </div>
    </div>

    <script>
        let globalComputadoras = [];

        // Cargar el archivo database.json al iniciar
        async function cargarBaseDeDatos() {
            try {
                const response = await fetch('database.json');
                if (!response.ok) throw new Error('No se pudo cargar el archivo database.json');
                
                const data = await response.json();
                globalComputadoras = data.computadoras;
                mostrarComputadoras(globalComputadoras);
            } catch (error) {
                console.error(error);
                document.getElementById('pcList').innerHTML = `
                    <p class="text-red-500 col-span-full text-center">Error al cargar la base de datos JSON. Asegúrate de que el archivo 'database.json' esté en la misma carpeta.</p>
                `;
            }
        }

        function mostrarComputadoras(computadoras) {
            const container = document.getElementById('pcList');
            container.innerHTML = '';

            computadoras.forEach(pc => {
                const card = document.createElement('div');
                card.className = 'bg-white border border-gray-200 rounded-lg p-4 shadow-sm hover:shadow-md transition';
                card.innerHTML = `
                    <div class="flex justify-between items-center mb-2">
                        <span class="font-bold text-lg text-blue-600">PC #${pc.id}</span>
                    </div>
                    <p class="text-xs text-gray-500 font-semibold uppercase tracking-wider mb-1">Software instalado:</p>
                    <p class="text-sm text-gray-700 bg-gray-50 p-2 rounded border border-gray-100">${pc.software || 'Sin software registrado'}</p>
                `;
                container.appendChild(card);
            });
        }

        // Lógica de búsqueda en tiempo real
        const searchInput = document.getElementById('searchSoftware');
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            const resultsDiv = document.getElementById('searchResults');

            if (query === '') {
                resultsDiv.innerHTML = '';
                return;
            }

            // Filtra qué computadoras contienen el texto buscado
            const coincidencias = globalComputadoras.filter(pc => 
                pc.software && pc.software.toLowerCase().includes(query)
            );

            if (coincidencias.length > 0) {
                const listadoPCs = coincidencias.map(pc => 
                    `<span class="bg-blue-600 text-white px-2 py-1 rounded font-medium mr-1 inline-block mb-1">PC #${pc.id}</span>`
                ).join(' ');
                resultsDiv.innerHTML = `<p class="font-medium text-green-700 mb-1">✓ Encontrado en ${coincidencias.length} equipo(s):</p><div>${listadoPCs}</div>`;
            } else {
                resultsDiv.innerHTML = `<p class="text-red-600">No se encontró ninguna computadora con ese software.</p>`;
            }
        });

        // Ejecutar al cargar la página
        cargarBaseDeDatos();
    </script>
</body>
</html>
